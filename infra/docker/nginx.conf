server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    # $http_host keeps the PORT the browser used ("workforce.swan.co.in:8099"); $host drops it,
    # which made the API compute its own origin as "http://workforce.swan.co.in" while the browser
    # sent "http://workforce.swan.co.in:8099" - so the same-origin check could never match on a
    # non-standard port and every POST was refused unless that exact origin was also listed in
    # CORS_ORIGINS. With the port preserved, whatever host:port a user types is recognised as this
    # application's own origin, and CORS_ORIGINS only has to name the official/public origins.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # Admin operations can legitimately take longer than a minute (a full LabourWorks sync,
    # the clocked-hours deep sweep). They must not answer 504 through this proxy while the API
    # is still working. The API's own endpoints stay bounded by their own timeouts.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
